name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0. Tags the commit v<version> and publishes a GitHub Release with the setup.'
        required: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DiskMon.sln

      - name: Build
        run: dotnet build DiskMon.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DiskMon.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  installer:
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $v = $env:INPUT_VERSION }
          elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not major.minor.patch." }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the setup
        run: installer/build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload the setup
        uses: actions/upload-artifact@v4
        with:
          name: DiskMon-Setup-${{ steps.version.outputs.version }}
          path: artifacts/installer/DiskMon-Setup-*.exe

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DiskMon ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/installer/DiskMon-Setup-*.exe
